# Despliegue en el VPS: `cp server/.env.example .env`, rellenar y `docker compose up -d`.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: focusguard
      POSTGRES_DB: focusguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusguard"]
      interval: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: focusguard
      PGDATABASE: focusguard
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TRUST_PROXY: "true"
      DNS_DOH_URL: https://${DNS_DOMAIN:?define DNS_DOMAIN en .env}/dns-query
      DNS_DOH_BOOTSTRAP: ${DNS_DOH_BOOTSTRAP:-}
    # Para el push: descomenta, pon la clave en ./secrets/fcm.json (fuera de git) y define FCM_SERVICE_ACCOUNT_FILE=/run/secrets/fcm.json en .env.
    # volumes:
    #   - ./secrets/fcm.json:/run/secrets/fcm.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      # La primera vez migra la base y publica las listas: los fallos de ese rato no cuentan.
      start_period: 60s
    expose:
      - "3000"

  dns:
    # Fija la versión que hayas probado; esta es la de partida.
    image: adguard/adguardhome:v0.107.57
    restart: unless-stopped
    # Espera a que el servidor responda: AdGuard Home pide la lista de reglas al arrancar.
    depends_on:
      server:
        condition: service_healthy
    # La plantilla se copia solo la primera vez: después AdGuard Home guarda sus cambios en el volumen.
    entrypoint:
      - /bin/sh
      - -c
      - '[ -f /opt/adguardhome/conf/AdGuardHome.yaml ] || cp /template/AdGuardHome.yaml /opt/adguardhome/conf/AdGuardHome.yaml; exec /opt/adguardhome/AdGuardHome --no-check-update -c /opt/adguardhome/conf/AdGuardHome.yaml -w /opt/adguardhome/work'
    volumes:
      - ./dns/AdGuardHome.yaml:/template/AdGuardHome.yaml:ro
      - dns-conf:/opt/adguardhome/conf
      - dns-work:/opt/adguardhome/work
    ports:
      # Panel de administración: solo desde el propio VPS (túnel SSH). Las consultas llegan por Caddy.
      - "127.0.0.1:3001:3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
      - dns
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?define DOMAIN en .env}
      DNS_DOMAIN: ${DNS_DOMAIN:?define DNS_DOMAIN en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  db-data:
  caddy-data:
  dns-conf:
  dns-work:
