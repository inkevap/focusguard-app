<title>Maqueta FocusGuard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Un teléfono navegable en el centro y, al lado, el mapa de todas las pantallas. Listas agrupadas, una decisión por pantalla. */
:root{
  --page:#E4EAE9;--screen:#F1F4F4;--card:#FFFFFF;--fg:#101817;--fg2:#667270;--sep:#E1E7E6;--fill:#E4EAE9;
  --accent:#0B6E6A;--accent-soft:#D6EEEA;--on-accent:#FFFFFF;
  --red:#CF3A30;--orange:#C06A10;--green:#23884C;--indigo:#5253C9;--gray:#7C8886;--on-icon:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#040707;--screen:#0A0F0F;--card:#171E1D;--fg:#EEF3F2;--fg2:#93A09E;--sep:#273130;--fill:#232D2C;
  --accent:#5FD0C6;--accent-soft:#12332F;--on-accent:#00201E;
  --red:#FF6B5E;--orange:#F0A04B;--green:#4CC47A;--indigo:#8F90F7;--gray:#6D7977;--on-icon:#0A0F0F;color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#040707;--screen:#0A0F0F;--card:#171E1D;--fg:#EEF3F2;--fg2:#93A09E;--sep:#273130;--fill:#232D2C;
  --accent:#5FD0C6;--accent-soft:#12332F;--on-accent:#00201E;
  --red:#FF6B5E;--orange:#F0A04B;--green:#4CC47A;--indigo:#8F90F7;--gray:#6D7977;--on-icon:#0A0F0F;color-scheme:dark}
html,body{height:100%}
body{background:var(--page);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;box-sizing:border-box}
*{box-sizing:border-box}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px;height:100%}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.top p{margin:0;color:var(--fg2);font-size:13px}
.stage{display:flex;gap:28px;align-items:stretch;justify-content:center;flex:1;min-height:0}
.phone{width:390px;max-width:100%;flex:none;background:var(--screen);border-radius:38px;border:8px solid var(--fg);display:flex;flex-direction:column;overflow:hidden;min-height:560px;height:100%;max-height:820px}
.status{display:flex;justify-content:space-between;padding:10px 26px 2px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.status span:last-child{color:var(--fg2);font-weight:500}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;padding:0 8px}
.nav b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.nav button{background:none;border:0;color:var(--accent);font:inherit;font-size:16px;padding:8px;cursor:pointer;display:flex;align-items:center;gap:2px;border-radius:8px;max-width:130px;white-space:nowrap;overflow:hidden}
.nav button:last-child{justify-self:end;font-weight:600}
.nav svg{width:20px;height:20px;flex:none}
.scr{flex:1;overflow-y:auto;padding:4px 16px 24px;display:flex;flex-direction:column;gap:18px}
.scr.in{animation:in .22s ease-out}.scr.out{animation:out .22s ease-out}
@keyframes in{from{transform:translateX(28px);opacity:.3}}@keyframes out{from{transform:translateX(-28px);opacity:.3}}
@media (prefers-reduced-motion:reduce){.scr.in,.scr.out{animation:none}}
.big{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:6px 4px 0}
.g{display:flex;flex-direction:column;gap:6px}
.gh{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg2);padding:0 16px}
.gf,.note{font-size:12.5px;color:var(--fg2);padding:0 16px;margin:0}
.note{font-size:14px;padding:0 4px}
.list{background:var(--card);border-radius:14px;overflow:hidden}
.r{display:flex;align-items:center;gap:12px;min-height:46px;padding:9px 14px;position:relative;cursor:default}
.r+.r::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:1px solid var(--sep)}
.r.ico+.r.ico::before{left:56px}
.r[data-to],.r.tap{cursor:pointer}
.r[data-to]:active,.r.tap:active{background:var(--fill)}
.r:focus-visible,.chip:focus-visible,.btn:focus-visible,.tile:focus-visible,.tabs button:focus-visible,.nav button:focus-visible,.map a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.rl{flex:1;min-width:0;display:flex;flex-direction:column}
.rl span{font-size:16px}.rl small{font-size:13px;color:var(--fg2)}
.rv{color:var(--fg2);font-size:15px;text-align:right;max-width:46%;font-variant-numeric:tabular-nums}
.r.d .rl span{color:var(--red)}.r.a .rl span{color:var(--accent)}
.chev{width:8px;height:14px;flex:none;color:var(--gray);opacity:.7}
.tick{width:18px;height:18px;color:var(--accent);visibility:hidden;flex:none}.r.on .tick{visibility:visible}
.ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--on-icon);flex:none}
.ic svg{width:18px;height:18px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--fill);position:relative;flex:none;cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw.on{background:var(--green)}.sw.on::after{transform:translateX(20px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;font:inherit;font-size:15px;padding:8px 14px;border-radius:999px;background:var(--card);color:var(--fg);cursor:pointer}
.chip.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.btn{border:0;font:inherit;font-size:17px;font-weight:600;padding:14px;border-radius:14px;background:var(--accent);color:var(--on-accent);cursor:pointer;width:100%}
.btn.gray{background:var(--fill);color:var(--accent)}.btn.red{background:var(--red);color:var(--on-accent)}.btn.plain{background:none;color:var(--accent);font-weight:500;padding:6px}
.hero{background:var(--card);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:4px}
.hero.acc{background:var(--accent);color:var(--on-accent)}
.hero b{font-size:20px;font-weight:700;letter-spacing:-.01em}.hero span{font-size:14px;opacity:.85}
.hero .num{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.center{text-align:center;align-items:center}
.pill{align-self:flex-start;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-top:6px}
.hero.acc .pill{background:rgba(255,255,255,.2);color:inherit}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:0;border-radius:16px;padding:14px;text-align:left;font:inherit;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:8px}
.tile b{font-size:16px;font-weight:600}.tile small{color:var(--fg2);font-size:12.5px;margin-top:-6px}
.field{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--fg);padding:0;outline:0}
.field::placeholder{color:var(--gray)}
.bars{display:flex;align-items:flex-end;gap:8px;height:96px;padding:0 4px}
.bars div{flex:1;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:3px;position:relative}
.bars div::after{content:attr(data-l);position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--fg2)}
.bars.pad{margin-bottom:22px}
.prog{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.days{display:flex;justify-content:space-between;gap:4px}
.days button{width:38px;height:38px;border-radius:50%;border:0;font:inherit;font-weight:600;background:var(--card);color:var(--fg);cursor:pointer}
.days button.on{background:var(--accent);color:var(--on-accent)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--card);border-radius:14px;padding:12px;font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.cal i{font-style:normal;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;color:var(--fg2)}
.cal i.ok{background:var(--accent-soft);color:var(--accent);font-weight:600}.cal i.no{background:var(--fill)}
.moods{display:flex;justify-content:space-between;gap:6px}
.moods button{flex:1;border:0;background:var(--card);border-radius:12px;padding:10px 0;font-size:24px;cursor:pointer}
.moods button.on{background:var(--accent-soft);outline:2px solid var(--accent)}
.dots{display:flex;gap:10px}.dots i{width:28px;height:28px;border-radius:50%;cursor:pointer}.dots i.on{outline:2px solid var(--fg);outline-offset:2px}
.lock{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px 8px}
.lock .e{font-size:56px}.lock b{font-size:24px;font-weight:700;letter-spacing:-.02em}.lock p{margin:0;color:var(--fg2)}
.timer{font-size:64px;font-weight:700;letter-spacing:-.03em;text-align:center;font-variant-numeric:tabular-nums;margin:12px 0 0}
.ring{width:150px;height:150px;border-radius:50%;border:10px solid var(--accent-soft);margin:6px auto;display:grid;place-items:center;color:var(--accent);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--sep);padding:6px 4px 10px}
.tabs button{flex:1;border:0;background:none;font:inherit;font-size:10.5px;font-weight:500;color:var(--gray);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:2px 0;border-radius:8px}
.tabs button.on{color:var(--accent)}.tabs svg{width:24px;height:24px}
.map{flex:1;min-width:0;max-width:420px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-right:4px}
.map h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg2);margin:0 0 6px;font-weight:600}
.map div{display:flex;flex-wrap:wrap;gap:6px}
.map a{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--card);color:var(--fg);text-decoration:none;cursor:pointer}
.map a.on{background:var(--accent);color:var(--on-accent)}
.map summary{display:none}
@media (max-width:760px){
  html,body{height:auto}.wrap{height:auto}.stage{flex-direction:column;align-items:center}
  .phone{height:calc(100dvh - 110px);min-height:520px;border-width:5px;border-radius:30px}
  .map{max-width:none;width:100%;overflow:visible}
}
</style>

<div class="wrap">
  <header class="top">
    <h1>FocusGuard · maqueta del rediseño</h1>
    <p>Toca dentro del teléfono como en la app. Todos los datos son de ejemplo. <span id="count"></span></p>
  </header>
  <div class="stage">
    <div class="phone">
      <div class="status"><span>9:41</span><span id="crumb"></span></div>
      <div class="nav" id="nav"></div>
      <div class="scr" id="scr"></div>
      <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
    </div>
    <aside class="map" id="map" aria-label="Mapa de pantallas"></aside>
  </div>
</div>

<script>
const P={home:"M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-4v6H5a1 1 0 0 1-1-1z",layers:"M12 3l9 5-9 5-9-5zM3 13l9 5 9-5",chart:"M5 20V10M12 20V4M19 20v-7",shield:"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z",sliders:"M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4",block:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM6 6l12 12",target:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z",moon:"M20 14A8 8 0 1 1 10 4a6.5 6.5 0 0 0 10 10z",life:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM5.6 5.6l4.3 4.3M14.1 14.1l4.3 4.3M18.4 5.6l-4.3 4.3M9.9 14.1l-4.3 4.3",wind:"M3 9h11a3 3 0 1 0-3-3M3 14h15a3 3 0 1 1-3 3M3 19h6",book:"M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2zM5 18a2 2 0 0 1 2-2h12",flame:"M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z",leaf:"M5 19c0-9 5-14 14-14 0 9-5 14-14 14zM5 19l8-8",test:"M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2",bell:"M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4",lock:"M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3",user:"M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 20c1-4 4-5 8-5s7 1 8 5",users:"M9 5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zM2 20c.5-3.5 3-5 7-5s6.5 1.5 7 5M16 5a3.5 3.5 0 0 1 0 7M18 15c2 .5 3.5 2 4 5",cloud:"M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9.5a4.3 4.3 0 0 1-.5 8.5z",image:"M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M15 9h.01",globe:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18",eyeoff:"M3 3l18 18M10 6a9 9 0 0 1 11 6 9.5 9.5 0 0 1-3 4M6 7.5A9.5 9.5 0 0 0 3 12a9 9 0 0 0 12 5.5M10 10a3 3 0 0 0 4 4",wrench:"M15 4a5 5 0 0 0-5 7l-6 6 3 3 6-6a5 5 0 0 0 7-5l-3 3-3-1-1-3z",key:"M15 4a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM11.5 12.5L4 20M7 17l2 2",clock:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2",apps:"M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z",help:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01",pin:"M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11zM12 8a2 2 0 1 0 0 4 2 2 0 0 0 0-4z",phone:"M8 3h8a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM11 18h2",heart:"M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z",back:"M14 5l-7 7 7 7"};
const svg=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const CHEV='<svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l6 6-6 6"/></svg>';
const TICK='<svg class="tick" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5l4 4 8-9"/></svg>';
const ic=(n,c)=>`<span class="ic" style="background:var(--${c||'accent'})">${svg(n)}</span>`;

/* Fila. o: s subtítulo · v valor · to destino · sw interruptor · ck marca (lista de elegir) · ic [icono,color] · d peligro · a acción */
function R(l,o={}){
  const cls=['r'];if(o.ic)cls.push('ico');if(o.d)cls.push('d');if(o.a)cls.push('a');
  if(o.ck!==undefined){cls.push('ckr','tap');if(o.ck)cls.push('on')}
  if(o.sw!==undefined&&!o.to)cls.push('tap');
  const tap=o.to||o.ck!==undefined||o.sw!==undefined;
  return `<div class="${cls.join(' ')}"${o.to?` data-to="${o.to}"`:''}${tap?' role="button" tabindex="0"':''}>${o.ic?ic(o.ic[0],o.ic[1]):''}<div class="rl"><span>${l}</span>${o.s?`<small>${o.s}</small>`:''}</div>${o.v?`<span class="rv">${o.v}</span>`:''}${o.sw!==undefined?`<i class="sw${o.sw?' on':''}"></i>`:''}${o.ck!==undefined?TICK:''}${o.to&&o.sw===undefined?CHEV:''}</div>`;
}
const G=(h,rows,f,radio)=>`<section class="g">${h?`<div class="gh">${h}</div>`:''}<div class="list"${radio?' data-radio="1"':''}>${rows.join('')}</div>${f?`<p class="gf">${f}</p>`:''}</section>`;
const RG=(h,opts,sel,f)=>G(h,opts.map((o,i)=>R(o,{ck:i===sel})),f,true);          // elegir una
const CK=(h,opts,on,f)=>G(h,opts.map((o,i)=>R(o,{ck:on.includes(i)})),f);          // elegir varias
const C=(items,sel,multi)=>`<div class="chips"${multi?' data-multi="1"':''}>${items.map((t,i)=>`<button class="chip${(multi?sel.includes(i):i===sel)?' on':''}">${t}</button>`).join('')}</div>`;
const B=(l,to,k)=>`<button class="btn ${k||''}"${to?` data-to="${to}"`:''}>${l}</button>`;
const N=t=>`<p class="note">${t}</p>`;
const F=(ph,v)=>`<div class="r"><input class="field" placeholder="${ph}" value="${v||''}" aria-label="${ph}"></div>`;
const H=(b,s,o={})=>`<div class="hero ${o.c||''}"${o.to?` data-to="${o.to}" role="button" tabindex="0" style="cursor:pointer"`:''}>${o.num?`<div class="num">${o.num}</div>`:''}<b>${b}</b>${s?`<span>${s}</span>`:''}${o.pill?`<span class="pill">${o.pill}</span>`:''}</div>`;
const bars=(vals,labels)=>{const m=Math.max(...vals);return `<div class="bars pad">${vals.map((v,i)=>`<div style="height:${Math.round(v/m*100)}%" data-l="${labels[i]}" title="${v}"></div>`).join('')}</div>`};
const tile=(n,c,b,s,to)=>`<button class="tile" data-to="${to}">${ic(n,c)}<b>${b}</b><small>${s}</small></button>`;

const TABS=[['inicio','Inicio','home'],['perfiles','Perfiles','layers'],['progreso','Progreso','chart'],['proteccion','Protección','shield'],['ajustes','Ajustes','sliders']];
const APPS=['Instagram','TikTok','X','Facebook','YouTube','Reddit','Snapchat','Telegram','WhatsApp','Chrome'];
const S={};
const scr=(id,t,tab,p,b,o={})=>S[id]={t,tab,p,b,...o};

/* ───── Inicio ───── */
scr('inicio','Inicio',0,null,()=>
  H('Protección activa','2 perfiles bloqueando ahora',{c:'acc',pill:'Modo estricto activo',to:'perfiles'})+
  `<div class="tiles">${tile('block','accent','Bloquear ya','Elige qué y cuánto','bloquear')+tile('target','indigo','Enfoque','Foco con descansos','enfoque')+tile('moon','gray','Dormir','Hasta que despiertes','dormir')+tile('wind','orange','Tengo un impulso','Cuenta atrás y respirar','impulso')}</div>`+
  G('En curso',[R('Bloquear ya',{s:'5 apps · quedan 24 min',v:'Terminar',a:1})])+
  G(null,[R('Tu racha',{ic:['flame','orange'],v:'12 días',to:'racha'}),R('Ayúdame',{ic:['life','red'],s:'Bloquea todo ahora. No se puede deshacer.',to:'ayudame'})]),{big:1});
scr('bloquear','Bloquear ya',0,'inicio',()=>
  `<section class="g"><div class="gh">Cuánto tiempo</div>${C(['15 min','30 min','1 h','2 h'],1)}</section>`+
  G(null,[R('Otra duración',{v:'Hasta las 10:11',to:'duracion'})])+
  G('Qué',[R('Qué hace',{v:'Bloquear',to:'p-modo'}),R('Apps',{v:'5',to:'p-apps'}),R('Webs',{v:'Ninguna',to:'p-webs'})])+
  G(null,[R('Cómo se puede terminar',{v:'Solo al acabar',to:'terminar'})])+B('Bloquear ahora','inicio'));
scr('duracion','Duración',0,'bloquear',()=>`<div class="timer">45 min</div>${N('Termina a las 10:26')}<input type="range" id="dur" min="5" max="240" step="5" value="45" aria-label="Minutos">`+G(null,[R('Minutos',{v:'− 45 +',s:'De 5 en 5, hasta 24 h'})]));
scr('terminar','Cómo terminar',0,'bloquear',()=>RG(null,['Cuando yo quiera','Solo cuando acabe el tiempo','Antes, si se cumple algo'],2)+
  G('Se cumple si',[R('Llego a un lugar',{sw:false}),R('Conecto el cargador',{sw:true}),R('Me conecto a un Wi-Fi',{sw:false}),R('Conecto un dispositivo Bluetooth',{sw:false}),R('Pasa un rato y pido aprobación',{sw:true,s:'Espera de 30 min'})],'Las condiciones solo aparecen con la tercera opción.'));

/* ───── Navegación ───── */
const $=id=>document.getElementById(id);
let stack=['inicio'],dir='in';
const cur=()=>stack[stack.length-1];
function go(id){
  if(id==='<')return back();
  if(!S[id])return;
  if(S[id].p===null){stack=[id]} else stack.push(id);
  dir='in';render();
}
function back(){
  if(stack.length>1)stack.pop();else{const p=S[cur()].p;if(!p)return;stack=[p]}
  dir='out';render();
}
function render(){
  const id=cur(),s=S[id],prev=stack.length>1?S[stack[stack.length-2]]:S[s.p];
  $('nav').hidden=!!s.bare;
  $('nav').innerHTML=(prev&&!s.big?`<button data-back="1" aria-label="Volver a ${prev.t}">${svg('back')}${prev.t}</button>`:'<span></span>')+`<b>${s.big?'':s.t}</b>`+(s.act?`<button data-to="${s.act[1]}">${s.act[0]}</button>`:'<span></span>');
  const el=$('scr');el.className='scr';void el.offsetWidth;el.className='scr '+dir;
  el.innerHTML=(s.big?`<h1 class="big">${s.t}</h1>`:'')+s.b();el.scrollTop=0;
  $('tabs').hidden=s.tab<0;
  $('tabs').innerHTML=TABS.map((t,i)=>`<button class="${i===s.tab?'on':''}" data-tab="${t[0]}"${i===s.tab?' aria-current="page"':''}>${svg(t[2])}${t[1]}</button>`).join('');
  $('crumb').textContent=stack.length>1?'nivel '+stack.length:'';
  document.querySelectorAll('#map a').forEach(a=>a.classList.toggle('on',a.dataset.jump===id));
  try{history.replaceState(null,'','#'+id)}catch(e){}
}
document.querySelector('.phone').addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-back]'))return back();
  const tab=t.closest('[data-tab]');if(tab){stack=[tab.dataset.tab];dir='in';return render()}
  const sw=t.closest('.sw');if(sw)return sw.classList.toggle('on');
  const chip=t.closest('.chip');if(chip){const box=chip.parentElement;if(box.dataset.multi)chip.classList.toggle('on');else box.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===chip));return}
  const pick=t.closest('.days button,.moods button,.dots i');if(pick){if(pick.closest('.days'))pick.classList.toggle('on');else pick.parentElement.querySelectorAll('*').forEach(c=>c.classList.toggle('on',c===pick));return}
  const to=t.closest('[data-to]');if(to){if(to.dataset.to)go(to.dataset.to);return}
  const r=t.closest('.r');if(!r)return;
  if(r.classList.contains('ckr')){const list=r.parentElement;if(list.dataset.radio)list.querySelectorAll('.ckr').forEach(x=>x.classList.toggle('on',x===r));else r.classList.toggle('on');return}
  const s2=r.querySelector('.sw');if(s2)s2.classList.toggle('on');
});
document.querySelector('.phone').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();e.target.click()}});
(function map(){
  const names=[...TABS.map(t=>t[1]),'Bienvenida, bloqueo y PIN'],groups=names.map(()=>[]);
  Object.entries(S).forEach(([id,s])=>groups[s.tab<0?5:s.tab].push(`<a data-jump="${id}" role="button" tabindex="0">${s.t}</a>`));
  $('map').innerHTML=groups.map((g,i)=>`<section><h2>${names[i]} · ${g.length}</h2><div>${g.join('')}</div></section>`).join('');
  $('count').textContent=Object.keys(S).length+' pantallas.';
  $('map').addEventListener('click',e=>{const a=e.target.closest('[data-jump]');if(!a)return;stack=[a.dataset.jump];dir='in';render();if(innerWidth<=760)document.querySelector('.phone').scrollIntoView({block:'start'})});
  $('map').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.jump)e.target.click()});
})();
const h=location.hash.slice(1);if(S[h])stack=[h];
render();
